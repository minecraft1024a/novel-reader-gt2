name: Build Android APK (workspace)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/novel-reader/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        run: |
          set +e
          flutter build apk --release
          status=$?
          echo "APK candidates after flutter build:"
          find . -type f -name '*.apk' -print
          if [ "$status" -ne 0 ]; then
            echo "Retrying the Android Gradle task with a stacktrace"
            (cd android && ./gradlew app:assembleRelease --no-daemon --stacktrace) || true
            echo "APK candidates after Gradle retry:"
            find . -type f -name '*.apk' -print
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/novel-reader/android/build/app/outputs/flutter-apk/app-release.apk
